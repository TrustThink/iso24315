    <text class="label" x="1918" y="608"><tspan x="1918">METR Consumer</tspan><tspan x="1918" dy="32">System</tspan></text>
    <use href="#vehicle-badge" x="2083" y="599"/>
  </a>

  <a class="hot" href="#metr-adapter-system" xlink:href="#metr-adapter-system" target="_top" aria-label="METR Adapter System">
    <rect class="box vehicle" x="1730" y="812" width="375" height="172"/>
    <text class="label" x="1918" y="846"><tspan x="1918">METR Adapter</tspan><tspan x="1918" dy="32">System</tspan></text>
