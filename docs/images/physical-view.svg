  <a class="hot" href="#metr-user" xlink:href="#metr-user" target="_top" aria-label="METR User">
    <rect class="box vehicle" x="1730" y="1048" width="375" height="172"/>
    <text class="label" x="1918" y="1082">METR User</text>
    <use href="#person-icon" x="1767" y="1181"/><use href="#vehicle-badge" x="2083" y="1073"/>
  </a>

  <!-- Clickable interface callouts -->
  <a class="hot" href="#if-1" xlink:href="#if-1" target="_top" aria-label="IF 1"><path class="linkbox" d="M1594 407h70l7-40 20 40h0q12 0 12 12v58q0 13-13 13h-94q-13 0-13-13v-57q0-13 11-13z"/><text class="if-label" x="1643" y="462">IF 1</text></a>
  <a class="hot" href="#if-2" xlink:href="#if-2" target="_top" aria-label="IF 2"><path class="linkbox" d="M2022 477l-74-18 74 38v51q0 13 13 13h95q13 0 13-13v-58q0-13-13-13z"/><text class="if-label" x="2083" y="530">IF 2</text></a>
  <a class="hot" href="#if-3" xlink:href="#if-3" target="_top" aria-label="IF 3"><path class="linkbox" d="M1568 503h94q13 0 13 13v57q0 13-13 13h-7l-29 50-4-50h-54q-13 0-13-13v-57q0-13 13-13z"/><text class="if-label" x="1615" y="557">IF 3</text></a>
