[project]
site_name = "METR"
site_description = "Management of Electronic Traffic Regulations — ISO 24315 series"
site_author = "ISO/TC 204/WG 19"
site_url = "https://ISO-TC204.github.io/iso24315/"
repo_url = "https://github.com/ISO-TC204/iso24315"
repo_name = "iso24315"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

copyright = """
Website content: <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license">CC BY 4.0</a>
"""

nav = [
  { "TC204 on ISO.org" = "https://www.iso.org/committee/54706.html" },
  { "TC 204 Home" = "https://isotc204.org/" },
  { "METR" = [
    { "METR" = "index.md" },
    { "What is METR" = "what-is-metr.md" },
    { "Key Components" = "key-components.md" },
    { "Standards Development" = [
      "development.md",
      "workshops.md",
    ]},
    { "Implementation Guides" = [
      { "Guide Structure" = "ig/guides.md" },
      { "Regional Guidance" = "ig/regional-guidance.md"},
      { "Sample Regional Framework" = "ig/regional-framework.md"},
      { "Rule Makers" = "ig/rule-makers.md" },
      { "Regulation System" = "ig/regulation-system.md" },
      { "Distribution System" = "ig/distribution-system.md" },
      { "Consumer System" = "ig/consumer-system.md" },
      { "Discrepancy Handling System" = "ig/discrepancy-handling-system.md" },
    ]},
    { "Traceability" = [
        "documentation/index.md",
        { "Introduction" = "documentation/Intro.md" },
        { "Vocab" = "documentation/Vocab.md" },
        { "ConOps" = "documentation/ConOps.md" },
        { "SoSR" = "documentation/SoSR.md" },
        { "SysR" = "documentation/SysR.md" },
        { "MDR" = "documentation/MDR.md" },
        { "Workshop Points" = "documentation/SP.md" },
        { "Notes" = "documentation/N.md" },
    ]},
    { "Frequently Asked Questions" = "faqs.md" },
    { "Discussion" = "https://github.com/ISO-TC204/iso24315/discussions" },
  ]},
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ISO-TC204/iso24315"

[project.theme]
language = "en"
logo = "images/car_wifi.png"
favicon = "images/car_wifi.png"
# Top-level nav items render as header tabs (matches isotc204.org parent site).
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "navigation.instant",
  "search.highlight",
  "search.suggest",
  "search.share",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
